<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#021242" />
    <meta
      name="description"
      content="NeuroD3 Dataset Reuse Hub: neuroscience datasets across archives, with the papers that reuse them"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>NeuroD3 · Dataset Reuse Hub</title>
    <script>
      // Apply the saved theme before the first paint (src/utils/theme.ts owns the key).
      try {
        if (localStorage.getItem('d3-theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
